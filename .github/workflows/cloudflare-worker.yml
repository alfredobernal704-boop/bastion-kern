name: Cloudflare worker validation
on:
  pull_request:
    paths: ["cloudflare/worker/**", ".github/workflows/cloudflare-worker.yml"]
  push:
    branches: ["feature/cloudflare-provider-ingestion-2026-11"]
    paths: ["cloudflare/worker/**", ".github/workflows/cloudflare-worker.yml"]
permissions:
  contents: read
concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run typecheck
