name: Android first-mobile prototype
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-prototype.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-prototype.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      MAPBOX_PUBLIC_TOKEN: ${{ vars.MAPBOX_PUBLIC_TOKEN }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate source registration
        run: |
          test -f app/src/main/java/app/bastionkern/MainActivity.kt
          test -f app/src/main/java/app/bastionkern/SeismicFeed.kt
          test -f app/src/test/java/app/bastionkern/SeismicFeedTest.kt
          echo "Android module sources are present."
      - name: Install Android SDK 35 and compile
        if: env.MAPBOX_DOWNLOADS_TOKEN != ''
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Report blocked build if Mapbox secret absent
        if: env.MAPBOX_DOWNLOADS_TOKEN == ''
        run: |
          echo "::warning::Android compilation NOT run: MAPBOX_DOWNLOADS_TOKEN secret is not configured."
          echo "Source structure checks passed. Set MAPBOX_DOWNLOADS_TOKEN to enable SDK resolution and build."
